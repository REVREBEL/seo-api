name: MCP Clerk OAuth

on:
  push:
    branches: [main]
    paths:
      - "src/mcp/**"
      - "test/mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-clerk-auth.yml"
  pull_request:
    paths:
      - "src/mcp/**"
      - "test/mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-clerk-auth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: Syntax check
        run: |
          node --check src/mcp/clerk-auth.js
          node --check src/mcp/clerk-mcp.js
          node --check src/mcp/server.js

      - name: Test MCP Clerk OAuth
        run: npm run test:mcp

      - name: Commit generated dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh MCP Clerk dependency lock"
          git push
