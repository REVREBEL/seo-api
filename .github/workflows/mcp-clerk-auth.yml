name: MCP Clerk OAuth

on:
  push:
    branches: [main]
    paths:
      - "src/mcp/**"
      - "test/mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-clerk-auth.yml"
  pull_request:
    paths:
      - "src/mcp/**"
      - "test/mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-clerk-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Syntax check
        run: |
          node --check src/mcp/clerk-auth.js
          node --check src/mcp/clerk-mcp.js
          node --check src/mcp/server.js

      - name: Test MCP Clerk OAuth
        run: npm run test:mcp
